<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scientific Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Calculator.css">
</head>
<body>

    <div class="calculator-container">
        <button class="history-btn" onclick="toggleHistory()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        </button>

        <div class="screen">
            <div id="mode-label" class="mode-indicator">DEG</div>
            <div id="expression" class="expression"></div>
            <div id="result" class="result">0</div>
        </div>

        <div class="controls">
            <!-- Row 1: Memory & Scientific -->
            <button class="btn-mem" onclick="memOp('MC')">MC</button>
            <button class="btn-mem" onclick="memOp('MR')">MR</button>
            <button class="btn-mem" onclick="memOp('M+')">M+</button>
            <button class="btn-mem" onclick="memOp('M-')">M-</button>
            <button class="btn-sci" onclick="toggleTheme()">🎨</button>

            <!-- Row 2: Scientific -->
            <button class="btn-sci" onclick="toggleMode()" id="mode-btn">RAD</button>
            <button class="btn-sci" onclick="append('sin(')">sin</button>
            <button class="btn-sci" onclick="append('cos(')">cos</button>
            <button class="btn-sci" onclick="append('tan(')">tan</button>
            <button class="btn-clear" onclick="allClear()">AC</button>

            <!-- Row 3 -->
            <button class="btn-sci" onclick="append('log(')">log</button>
            <button class="btn-sci" onclick="append('ln(')">ln</button>
            <button class="btn-sci" onclick="append('(')">(</button>
            <button class="btn-sci" onclick="append(')')">)</button>
            <button class="btn-clear" onclick="backspace()">⌫</button>

            <!-- Row 4 -->
            <button class="btn-sci" onclick="append('^2')">x²</button>
            <button class="btn-sci" onclick="append('^')">xʸ</button>
            <button class="btn-num" onclick="append('7')">7</button>
            <button class="btn-num" onclick="append('8')">8</button>
            <button class="btn-num" onclick="append('9')">9</button>

            <!-- Row 5 -->
            <button class="btn-sci" onclick="append('sqrt(')">√</button>
            <button class="btn-sci" onclick="append('root(')">ⁿ√</button>
            <button class="btn-num" onclick="append('4')">4</button>
            <button class="btn-num" onclick="append('5')">5</button>
            <button class="btn-num" onclick="append('6')">6</button>

            <!-- Row 6 -->
            <button class="btn-sci" onclick="append('!')">n!</button>
            <button class="btn-op" onclick="append('/')">÷</button>
            <button class="btn-num" onclick="append('1')">1</button>
            <button class="btn-num" onclick="append('2')">2</button>
            <button class="btn-num" onclick="append('3')">3</button>

            <!-- Row 7 -->
            <button class="btn-sci" onclick="append('PI')">π</button>
            <button class="btn-op" onclick="append('*')">×</button>
            <button class="btn-num" onclick="append('0')">0</button>
            <button class="btn-num" onclick="append('.')">.</button>
            <button class="btn-op" onclick="append('-')">−</button>

            <!-- Row 8 -->
            <button class="btn-sci" onclick="append('E')">e</button>
            <button class="btn-op" onclick="append('+')">+</button>
            <button class="btn-equal" onclick="calculate()">=</button>
        </div>

        <!-- History Panel -->
        <div id="history-panel" class="history-panel">
            <div class="history-header">
                <h3>History</h3>
                <button onclick="toggleHistory()" style="background:none; box-shadow:none;">Close</button>
            </div>
            <ul id="history-list" class="history-list">
                <!-- Items added here -->
            </ul>
            <button class="btn-clear" onclick="clearHistory()" style="width:100%; margin-top:10px;">Clear History</button>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="Calculator.js"></script>
</body>
</html>
